# Настройки АСКУЭ базы. Файл хранится в git: после правки — коммит и деплой.
# Секреты (пароли, токен бота) сюда НЕ писать — они в .env на сервере.

site: "База ООО «РегионСтройСистемы», ул. Кардачинская, 28"
timezone: "Asia/Krasnoyarsk"

# Опрос. Замер 23.11.2026: один запрос мощности через шлюз — 44 мс, мощность по 5 каналам ША1 — 0,22 с,
# полный набор величин — 1,03 с. Счётчик обновляет мощность чаще, чем её можно прочитать.
fast_interval_s: 2        # мощность (P по фазам) — каждые 2 с
fast_retention_days: 14   # сколько хранить 2-секундные данные; минутные средние/мин/макс хранятся всегда
modbus_timeout_s: 1.5     # сколько ждать ответа счётчика, секунд

# Шлюзы USR-DR302: Modbus RTU поверх TCP, порт счётчиков 9600 8N2.
# Шлюз держит ОДНО подключение: новое выбивает старое. Пока работает опросчик, не подключаться к шлюзам
# с других компьютеров (askue_check.py и т.п.) — иначе пропадут точки.
gateways:
  GW1: {host: 192.168.12.200, port: 20108, cabinet: "ША1"}
  GW2: {host: 192.168.14.200, port: 20108, cabinet: "ША2"}

# Точки учёта — каналы счётчиков (то, что измеряется). id не менять: по нему хранятся данные.
points:
  - {id: "M1.1", name: "M1 к.1 — Склад 1",              gateway: GW1, unit: 11, channel: 1}
  - {id: "M1.2", name: "M1 к.2 — Офис",                 gateway: GW1, unit: 11, channel: 2}
  - {id: "M1.3", name: "M1 к.3 — К11",                  gateway: GW1, unit: 11, channel: 3}
  - {id: "M1.4", name: "M1 к.4 — линия на ВРУ С2 + С3", gateway: GW1, unit: 11, channel: 4}
  - {id: "M2",   name: "M2 — Сторожка",                 gateway: GW1, unit: 12, channel: 1}
  - {id: "M3",   name: "M3 — Склад 3, линия 1",         gateway: GW2, unit: 21, channel: 1}
  - {id: "M4",   name: "M4 — Склад 3, линия 2",         gateway: GW2, unit: 22, channel: 1}

# Объекты — то, за чем следят люди. terms: какие точки складывать (+) и вычитать (−).
# Склад 2 считается: линия на ВРУ «Склад 2 + Склад 3» минус Склад 3 (M3 + M4).
#   От этого ВРУ питаются только Склад 2 и Склад 3 (подтвердил С. В. Фролков 23.11.2026).
# night_max_kw — сколько объект может потреблять в нерабочее время, кВт (null — порог не задан,
#   тогда объект сравнивается со своим обычным ночным потреблением за прошлые дни).
# total: true — итог по базе, в проверке «не выключен» не участвует.
objects:
  - {id: sklad1,    name: "Склад 1",  terms: ["+M1.1"],               night_max_kw: null}
  - {id: office,    name: "Офис",     terms: ["+M1.2"],               night_max_kw: null}
  - {id: k11,       name: "К11",      terms: ["+M1.3"],               night_max_kw: null}
  - {id: sklad2,    name: "Склад 2",  terms: ["+M1.4", "-M3", "-M4"], night_max_kw: null}
  - {id: sklad3,    name: "Склад 3",  terms: ["+M3", "+M4"],          night_max_kw: null}
  - {id: storozhka, name: "Сторожка", terms: ["+M2"],                 night_max_kw: null}
  - {id: total,     name: "Вся база", terms: ["+M1.1", "+M1.2", "+M1.3", "+M1.4", "+M2"], total: true}

reports:
  evening_time: "20:00"    # вечерний отчёт (местное время)
  morning_time: "08:00"    # утренняя сводка за прошлые сутки (только личные чаты)
  night_hours: [1, 5]      # часы, по которым считается «обычная ночная мощность»: с 01:00 до 05:00
  typical_days: 14         # за сколько прошлых дней считать обычную ночную мощность
  suspicious_factor: 2.0   # без порога: «проверить», если сейчас больше обычной ночной в столько раз
  suspicious_min_kw: 1.0   # ...и при этом больше этого значения, кВт
  now_avg_s: 10            # «сейчас» = среднее за последние столько секунд

alerts:
  enabled: true
  window: ["21:00", "07:00"]  # в это время бот следит за порогами night_max_kw
  sustain_min: 15             # превышение должно держаться столько минут
  repeat_min: 120             # повторять предупреждение не чаще, чем раз в столько минут
  offline_min: 10             # «нет связи», если от точки нет данных столько минут
  export_kwh_per_hour: 0.05   # рост энергии отдачи за час больше этого — ошибка подключения ТТ
