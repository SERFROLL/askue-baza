# Настройки АСКУЭ базы. Файл хранится в git: после правки — коммит и деплой.
# Секреты (пароли, токен бота) сюда НЕ писать — они в .env на сервере.

site: "База ООО «РегионСтройСистемы», ул. Кардачинская, 28"
timezone: "Asia/Krasnoyarsk"

poll_interval_s: 60       # как часто опрашивать счётчики, секунд
modbus_timeout_s: 3       # сколько ждать ответа счётчика, секунд

# Шлюзы USR-DR302: Modbus RTU поверх TCP, порт счётчиков 9600 8N2.
gateways:
  GW1: {host: 192.168.12.200, port: 20108, cabinet: "ША1"}
  GW2: {host: 192.168.14.200, port: 20108, cabinet: "ША2"}

# Точки учёта. id не менять: по нему хранятся данные в базе.
# night_max_kw — сколько объект может потреблять в нерабочее время, кВт.
#   Если ночью мощность выше порога, в вечернем отчёте и в предупреждении объект
#   помечается как «не выключен». null — порог ещё не задан: тогда объект
#   сравнивается со своей обычной ночной мощностью за прошлые дни.
points:
  - {id: "M1.1", name: "Склад 1",                     gateway: GW1, unit: 11, channel: 1, night_max_kw: null}
  - {id: "M1.2", name: "Офис",                        gateway: GW1, unit: 11, channel: 2, night_max_kw: null}
  - {id: "M1.3", name: "К11",                         gateway: GW1, unit: 11, channel: 3, night_max_kw: null}
  - {id: "M1.4", name: "Линия на ВРУ Склад 2 + Склад 3", gateway: GW1, unit: 11, channel: 4, night_max_kw: null}
  - {id: "M2",   name: "Сторожка",                    gateway: GW1, unit: 12, channel: 1, night_max_kw: null}
  - {id: "M3",   name: "Склад 3, линия 1",            gateway: GW2, unit: 21, channel: 1, night_max_kw: null}
  - {id: "M4",   name: "Склад 3, линия 2",            gateway: GW2, unit: 22, channel: 1, night_max_kw: null}

reports:
  evening_time: "20:00"    # время ежедневного отчёта (местное)
  night_hours: [1, 5]      # часы, по которым считается «обычная ночная мощность»: с 01:00 до 05:00
  typical_days: 14         # за сколько прошлых дней считать обычную ночную мощность
  suspicious_factor: 2.0   # без порога: «проверить», если сейчас больше обычной ночной в столько раз
  suspicious_min_kw: 1.0   # ...и при этом больше этого значения, кВт

alerts:
  enabled: true
  window: ["21:00", "07:00"]  # в это время бот следит за порогами night_max_kw
  sustain_min: 15             # превышение должно держаться столько минут
  repeat_min: 120             # повторять предупреждение не чаще, чем раз в столько минут
  offline_min: 10             # «нет связи», если от точки нет данных столько минут
